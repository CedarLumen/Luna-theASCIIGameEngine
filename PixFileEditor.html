<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PIX 像素绘制器</title>
    <style>
        :root {
            --bg: #16161c;
            --panel: #22222c;
            --border: #35354a;
            --text: #e6e6f0;
            --muted: #8a8aa0;
            --accent: #5b8cff;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            overflow: hidden;
        }

        /* ===== 画布区 ===== */
        #stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            padding: 24px;
            background: radial-gradient(circle at 30% 20%, #20202c 0%, #101016 70%);
        }

        #canvas {
            image-rendering: pixelated;
            box-shadow: 0 10px 50px rgba(0,0,0,.65);
            border-radius: 4px;
            cursor: crosshair;
            touch-action: none;
            background: #fff;
        }

        /* ===== 侧栏 ===== */
        #panel {
            width: 300px;
            flex: none;
            background: var(--panel);
            border-left: 1px solid var(--border);
            padding: 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

            #panel h1 {
                margin: 0;
                font-size: 16px;
                letter-spacing: .5px;
                display: flex;
                align-items: center;
                gap: 8px;
            }

                #panel h1::before {
                    content: '';
                    width: 10px;
                    height: 10px;
                    border-radius: 2px;
                    background: linear-gradient(135deg,#5b8cff,#c46bff);
                }

        section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

            section > label {
                font-size: 12px;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: .6px;
            }

        .row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

            .row > span {
                color: var(--muted);
                font-size: 13px;
            }

        input[type="number"], input[type="text"] {
            background: #1a1a22;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 7px 9px;
            font-size: 13px;
            width: 100%;
            outline: none;
            font-family: inherit;
        }

            input[type="number"]:focus, input[type="text"]:focus {
                border-color: var(--accent);
            }

        input[type="color"] {
            -webkit-appearance: none;
            appearance: none;
            width: 46px;
            height: 34px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: none;
            cursor: pointer;
            flex: none;
        }

            input[type="color"]::-webkit-color-swatch-wrapper {
                padding: 2px;
            }

            input[type="color"]::-webkit-color-swatch {
                border: none;
                border-radius: 4px;
            }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #33334a;
            outline: none;
        }

            input[type="range"]::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: var(--accent);
                cursor: pointer;
                border: 2px solid #22222c;
            }

        button {
            background: #2b2b38;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 7px;
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            transition: .15s;
            flex: 1;
        }

            button:hover {
                background: #35354a;
            }

            button.active {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }

            button.primary {
                background: linear-gradient(135deg,#5b8cff,#7b6bff);
                border: none;
                color: #fff;
                font-weight: 600;
            }

                button.primary:hover {
                    filter: brightness(1.12);
                }

        /* 调色板 */
        #palette {
            display: grid;
            grid-template-columns: repeat(10,1fr);
            gap: 5px;
        }

        .swatch {
            aspect-ratio: 1;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: .12s;
        }

            .swatch:hover {
                transform: scale(1.15);
            }

            .swatch.active {
                border-color: #fff;
                box-shadow: 0 0 0 1px #000 inset;
            }

        #status {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
            min-height: 18px;
            word-break: break-all;
        }

            #status.ok {
                color: #5fd38d;
            }

            #status.err {
                color: #ff7b7b;
            }

        @media (max-width:760px) {
            body {
                flex-direction: column;
            }

            #panel {
                width: 100%;
                border-left: none;
                border-top: 1px solid var(--border);
                max-height: 52vh;
            }

            #stage {
                flex: 1;
                min-height: 40vh;
            }
        }
    </style>
</head>
<body>

    <div id="stage">
        <canvas id="canvas"></canvas>
    </div>

    <aside id="panel">
        <h1>PIX 像素绘制器</h1>

        <section>
            <label>画布尺寸</label>
            <div class="row">
                <input type="number" id="widthInput" min="1" max="256" value="16">
                <span>×</span>
                <input type="number" id="heightInput" min="1" max="256" value="16">
                <button id="applySize" style="flex:none;padding:8px 10px;">应用</button>
            </div>
        </section>

        <section>
            <label>画笔颜色</label>
            <div class="row">
                <input type="color" id="colorPicker" value="#ff4d4d">
                <input type="text" id="hexDisplay" value="#ff4d4d" spellcheck="false">
            </div>
            <label style="margin-top:4px;">不透明度 <span id="alphaValue">255</span></label>
            <input type="range" id="alphaRange" min="0" max="255" value="255">
        </section>

        <section>
            <label>字符</label>
            <input type="text" id="charInput" maxlength="1" value="A" spellcheck="false">
        </section>

        <section>
            <label>调色板</label>
            <div id="palette"></div>
        </section>

        <section>
            <label>工具</label>
            <div class="row">
                <button class="tool active" data-tool="brush">画笔</button>
                <button class="tool" data-tool="eraser">橡皮</button>
                <button class="tool" data-tool="picker">吸管</button>
                <button class="tool" data-tool="fill">填充</button>
            </div>
        </section>

        <section>
            <label>缩放 <span id="cellValue">24</span> px / 格</label>
            <input type="range" id="cellRange" min="8" max="48" value="24">
        </section>

        <section>
            <label>操作</label>
            <button id="downloadBtn" class="primary">下载 .pix</button>
            <div class="row">
                <button id="importBtn">导入 .pix</button>
                <button id="clearBtn">清空</button>
            </div>
            <input type="file" id="fileInput" accept=".pix,.txt,text/plain" hidden>
        </section>

        <div id="status">左键绘制 · 右键擦除 · 填充工具右键可整片清除</div>
    </aside>

    <script>
        /* =========================================================
         *  状态
         * =======================================================*/
        const state = {
            width: 16,
            height: 16,
            cell: 24,
            pixels: [],          // { c, r, g, b, a }
            tool: 'brush'
        };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        const hexDisplay = document.getElementById('hexDisplay');
        const alphaRange = document.getElementById('alphaRange');
        const alphaValue = document.getElementById('alphaValue');
        const charInput = document.getElementById('charInput');
        const widthInput = document.getElementById('widthInput');
        const heightInput = document.getElementById('heightInput');
        const cellRange = document.getElementById('cellRange');
        const cellValue = document.getElementById('cellValue');
        const statusEl = document.getElementById('status');

        /* =========================================================
         *  工具函数
         * =======================================================*/
        const blankPixel = () => ({ c: '.', r: 0, g: 0, b: 0, a: 0 });

        function hexToRgb(hex) {
            return {
                r: parseInt(hex.slice(1, 3), 16),
                g: parseInt(hex.slice(3, 5), 16),
                b: parseInt(hex.slice(5, 7), 16)
            };
        }
        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(v =>
                Math.max(0, Math.min(255, v | 0)).toString(16).padStart(2, '0')
            ).join('');
        }
        /** 保证字符可被 `iss >> c` 正确读回：非空白、不是 '#' */
        function safeChar(c) {
            if (!c || /\s/.test(c)) return '.';
            if (c === '#') return '%';
            return c;
        }
        function currentChar() {
            return safeChar(charInput.value);
        }
        function currentColor() {
            const { r, g, b } = hexToRgb(colorPicker.value);
            return { r, g, b, a: parseInt(alphaRange.value, 10) };
        }
        function setStatus(msg, type) {
            statusEl.textContent = msg;
            statusEl.className = type || '';
        }

        /* =========================================================
         *  像素缓冲
         * =======================================================*/
        function initPixels(w, h) {
            state.pixels = Array.from({ length: w * h }, blankPixel);
        }
        function resizeCanvas(w, h, keep) {
            const old = state.pixels, ow = state.width, oh = state.height;
            state.width = w; state.height = h;
            const next = Array.from({ length: w * h }, blankPixel);
            if (keep) {
                for (let y = 0; y < Math.min(h, oh); y++) {
                    for (let x = 0; x < Math.min(w, ow); x++) {
                        next[y * w + x] = old[y * ow + x];
                    }
                }
            }
            state.pixels = next;
            render();
        }

        /* =========================================================
         *  渲染
         * =======================================================*/
        function render() {
            const cs = state.cell;
            const W = state.width * cs;
            const H = state.height * cs;

            canvas.width = W;
            canvas.height = H;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';

            ctx.clearRect(0, 0, W, H);

            // 1. 透明棋盘格底
            for (let y = 0; y < state.height; y++) {
                for (let x = 0; x < state.width; x++) {
                    ctx.fillStyle = ((x + y) & 1) ? '#d9d9e2' : '#ffffff';
                    ctx.fillRect(x * cs, y * cs, cs, cs);
                }
            }

            // 2. 绘制字符
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = `${Math.max(6, Math.floor(cs * 0.78))}px "Menlo","Consolas","Courier New",monospace`;

            for (let y = 0; y < state.height; y++) {
                for (let x = 0; x < state.width; x++) {
                    const p = state.pixels[y * state.width + x];
                    if (!p || p.a === 0) continue;
                    if (!p.c || p.c === ' ') continue;
                    ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${(p.a / 255).toFixed(3)})`;
                    ctx.fillText(p.c, x * cs + cs / 2, y * cs + cs / 2 + cs * 0.04);
                }
            }

            // 3. 网格线
            if (cs >= 10) {
                ctx.strokeStyle = 'rgba(0,0,0,.13)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let x = 0; x <= state.width; x++) {
                    ctx.moveTo(x * cs + .5, 0);
                    ctx.lineTo(x * cs + .5, H);
                }
                for (let y = 0; y <= state.height; y++) {
                    ctx.moveTo(0, y * cs + .5);
                    ctx.lineTo(W, y * cs + .5);
                }
                ctx.stroke();
            }
        }

        /* =========================================================
         *  填充（洪水填充）
         * =======================================================*/
        /** 两个像素是否完全相同（字符 + RGBA 都一致才算同一片区域） */
        function samePixel(p, q) {
            return !!p && !!q &&
                p.c === q.c && p.r === q.r && p.g === q.g && p.b === q.b && p.a === q.a;
        }

        /**
         * 从 (sx, sy) 出发，把四连通的同色区域涂成当前颜色。
         * erase 为 true（或当前是橡皮）时，改为整片清除为透明。
         */
        function floodFill(sx, sy, erase) {
            const w = state.width, h = state.height;
            const startIdx = sy * w + sx;
            const target = state.pixels[startIdx];
            if (!target) return;

            // 1. 计算“新像素”
            let next;
            if (state.tool === 'eraser' || erase) {
                next = blankPixel();
            } else {
                const col = currentColor();
                next = { c: currentChar(), r: col.r, g: col.g, b: col.b, a: col.a };
            }

            // 2. 起点已与目标一致，无需操作
            if (samePixel(target, next)) {
                setStatus(erase ? '该区域已经是空的' : '该区域已经是这个颜色了');
                return;
            }

            // 3. 迭代式洪水填充（避免递归爆栈）
            const visited = new Uint8Array(w * h);
            const stack = [startIdx];
            visited[startIdx] = 1;

            let count = 0;
            while (stack.length) {
                const i = stack.pop();
                if (!samePixel(state.pixels[i], target)) continue;

                state.pixels[i] = {
                    c: next.c, r: next.r, g: next.g, b: next.b, a: next.a
                };
                count++;

                const x = i % w;
                const y = (i - x) / w;

                if (x > 0 && !visited[i - 1]) { visited[i - 1] = 1; stack.push(i - 1); }
                if (x < w - 1 && !visited[i + 1]) { visited[i + 1] = 1; stack.push(i + 1); }
                if (y > 0 && !visited[i - w]) { visited[i - w] = 1; stack.push(i - w); }
                if (y < h - 1 && !visited[i + w]) { visited[i + w] = 1; stack.push(i + w); }
            }

            render();
            setStatus(
                erase ? `已清除 ${count} 个像素`
                    : `已填充 ${count} 个像素（字符 "${next.c}"）`,
                'ok'
            );
        }

        /* =========================================================
         *  绘制交互
         * =======================================================*/
        let painting = false;
        let paintErase = false;

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / rect.width * state.width);
            const y = Math.floor((e.clientY - rect.top) / rect.height * state.height);
            if (x < 0 || y < 0 || x >= state.width || y >= state.height) return null;
            return { x, y };
        }

        function paintAt(x, y, erase) {
            const idx = y * state.width + x;
            const p = state.pixels[idx];
            if (!p) return;

            if (state.tool === 'picker') {
                if (p.a > 0 || p.r || p.g || p.b) {
                    colorPicker.value = rgbToHex(p.r, p.g, p.b);
                    hexDisplay.value = colorPicker.value;
                    alphaRange.value = p.a;
                    alphaValue.textContent = p.a;
                    charInput.value = p.c === '.' ? 'A' : p.c;
                    setStatus(`取色：${p.c}  ${p.r},${p.g},${p.b},${p.a}`, 'ok');
                }
                return;
            }

            // 填充：一次性操作
            if (state.tool === 'fill') {
                floodFill(x, y, erase);
                return;
            }

            if (state.tool === 'eraser' || erase) {
                p.c = '.'; p.r = 0; p.g = 0; p.b = 0; p.a = 0;
            } else {
                const col = currentColor();
                p.c = currentChar();
                p.r = col.r; p.g = col.g; p.b = col.b; p.a = col.a;
            }
            render();
        }

        canvas.addEventListener('contextmenu', e => e.preventDefault());

        canvas.addEventListener('pointerdown', e => {
            const pos = getPos(e);
            if (!pos) return;
            canvas.setPointerCapture(e.pointerId);
            paintErase = (e.button === 2) || (e.buttons & 2) !== 0;

            // 填充工具只响应单次点击，不进入拖拽绘制
            if (state.tool === 'fill') {
                paintAt(pos.x, pos.y, paintErase);
                return;
            }

            painting = true;
            paintAt(pos.x, pos.y, paintErase);
        });

        canvas.addEventListener('pointermove', e => {
            if (!painting) return;
            const pos = getPos(e);
            if (pos) paintAt(pos.x, pos.y, paintErase);
        });

        const endPaint = () => { painting = false; paintErase = false; };
        canvas.addEventListener('pointerup', endPaint);
        canvas.addEventListener('pointercancel', endPaint);
        window.addEventListener('pointerup', endPaint);

        /* =========================================================
         *  侧栏控件
         * =======================================================*/
        // 颜色
        colorPicker.addEventListener('input', () => {
            hexDisplay.value = colorPicker.value;
            markSwatch(colorPicker.value);
        });
        hexDisplay.addEventListener('change', () => {
            const v = hexDisplay.value.trim();
            if (/^#[0-9a-fA-F]{6}$/.test(v)) {
                colorPicker.value = v.toLowerCase();
                markSwatch(colorPicker.value);
            } else {
                hexDisplay.value = colorPicker.value;
            }
        });

        // 透明度
        alphaRange.addEventListener('input', () => {
            alphaValue.textContent = alphaRange.value;
        });

        // 字符
        charInput.addEventListener('input', () => {
            const c = safeChar(charInput.value);
            if (charInput.value !== c) charInput.value = c;
        });

        // 缩放
        cellRange.addEventListener('input', () => {
            state.cell = parseInt(cellRange.value, 10);
            cellValue.textContent = state.cell;
            render();
        });

        // 尺寸
        document.getElementById('applySize').addEventListener('click', () => {
            let w = parseInt(widthInput.value, 10) || 16;
            let h = parseInt(heightInput.value, 10) || 16;
            w = Math.max(1, Math.min(256, w));
            h = Math.max(1, Math.min(256, h));
            widthInput.value = w; heightInput.value = h;
            resizeCanvas(w, h, true);
            setStatus(`画布已调整为 ${w} × ${h}`, 'ok');
        });

        // 工具
        document.querySelectorAll('.tool').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tool').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.tool = btn.dataset.tool;
                canvas.style.cursor =
                    state.tool === 'picker' ? 'copy' :
                        state.tool === 'fill' ? 'cell' :
                            state.tool === 'eraser' ? 'cell' : 'crosshair';
            });
        });

        // 调色板
        const PALETTE = [
            '#000000', '#3b3b3b', '#7f7f7f', '#c0c0c0', '#ffffff',
            '#ff0000', '#ff7f00', '#ffd400', '#7fff00', '#00c853',
            '#00e5c0', '#00b0ff', '#2962ff', '#7c4dff', '#e040fb',
            '#ff4081', '#8b4513', '#b8860b', '#1b5e20', '#0d47a1'
        ];
        const paletteEl = document.getElementById('palette');
        PALETTE.forEach(col => {
            const d = document.createElement('div');
            d.className = 'swatch';
            d.style.background = col;
            d.dataset.color = col;
            d.title = col;
            d.addEventListener('click', () => {
                colorPicker.value = col;
                hexDisplay.value = col;
                markSwatch(col);
            });
            paletteEl.appendChild(d);
        });
        function markSwatch(col) {
            document.querySelectorAll('.swatch').forEach(s => {
                s.classList.toggle('active', s.dataset.color.toLowerCase() === col.toLowerCase());
            });
        }

        // 清空
        document.getElementById('clearBtn').addEventListener('click', () => {
            if (!confirm('确定清空全部像素吗？')) return;
            initPixels(state.width, state.height);
            render();
            setStatus('已清空画布');
        });

        /* =========================================================
         *  下载 .pix
         * =======================================================*/
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const lines = ['# 格式: c r g b a  (按行顺序对应像素，从左到右、从上到下)'];
            for (const p of state.pixels) {
                lines.push(`${p.c} ${p.r} ${p.g} ${p.b} ${p.a}`);
            }
            const text = lines.join('\n') + '\n';
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = `sprite_${state.width}x${state.height}.pix`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);

            setStatus(`已导出 ${state.pixels.length} 个像素 → ${a.download}`, 'ok');
        });

        /* =========================================================
         *  导入 .pix
         * =======================================================*/
        document.getElementById('importBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', e => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    loadPixText(reader.result, file.name);
                } catch (err) {
                    setStatus('解析失败：' + err.message, 'err');
                }
            };
            reader.readAsText(file, 'utf-8');
            e.target.value = '';
        });

        /** 推测接近正方形的尺寸 */
        function autoSize(n) {
            const s = Math.round(Math.sqrt(n));
            if (s * s === n) return { w: s, h: s };
            for (let w = Math.ceil(Math.sqrt(n)); w <= n; w++) {
                if (n % w === 0) return { w, h: n / w };
            }
            return { w: n, h: 1 };
        }

        function loadPixText(text, filename) {
            const px = [];
            const lines = text.split(/\r?\n/);

            for (const raw of lines) {
                const line = raw.trim();
                if (!line) continue;
                if (line[0] === '#') continue;           // 注释

                const parts = line.split(/\s+/);
                if (parts.length < 5) continue;

                const c = parts[0][0];
                const r = parseInt(parts[1], 10);
                const g = parseInt(parts[2], 10);
                const b = parseInt(parts[3], 10);
                const a = parseInt(parts[4], 10);

                if ([r, g, b, a].some(v => Number.isNaN(v))) continue;

                px.push({
                    c,
                    r: Math.max(0, Math.min(255, r)),
                    g: Math.max(0, Math.min(255, g)),
                    b: Math.max(0, Math.min(255, b)),
                    a: Math.max(0, Math.min(255, a))
                });
            }

            if (!px.length) {
                setStatus('文件里没有读到有效像素', 'err');
                return;
            }

            // 尺寸处理：数量匹配就沿用当前画布，否则自动推测
            const total = state.width * state.height;
            if (px.length === total) {
                state.pixels = px;
            } else {
                const { w, h } = autoSize(px.length);
                state.width = w; state.height = h;
                widthInput.value = w; heightInput.value = h;
                state.pixels = px;
            }

            render();
            setStatus(`已导入 ${filename}：${px.length} 个像素 → ${state.width} × ${state.height}`, 'ok');
        }

        /* =========================================================
         *  启动
         * =======================================================*/
        initPixels(state.width, state.height);
        markSwatch(colorPicker.value);
        render();
    </script>
</body>
</html>
